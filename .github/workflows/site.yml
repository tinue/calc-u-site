name: Site

# Checks every push to main: each site folder (/59/, /1600/) holds exactly its pinned
# release (help asset, Web frontend, examples), its pages are what the
# build makes from them, its static checks pass, and the Playwright tests
# pass against the repository served as calc-u.org serves it.
#
# GitHub Pages publishes main as it is ("Deploy from a branch"); this
# workflow commits nothing. A failure means the published site is stale or
# broken — fix it locally and push again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The renderer of the help asset, shared by the folders, on its test asset.
  help-renderer:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .help
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm test

  site-59:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 59
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Renderer dependencies
        run: npm ci --no-audit --no-fund
        working-directory: .help

      # Downloads the pinned assets and the examples of the pinned tag again
      # and fails when they differ from what is committed (or from the
      # pinned sha256).
      - name: The folder holds the pinned release
        run: |
          node ../.help/pins.js 59
          git diff --exit-code -- calc help-asset software-files
          test -z "$(git status --porcelain -- calc help-asset software-files)"

      - name: Build is current
        run: |
          node .seo/build.js
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"

      - name: Check
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node .seo/check.js

      - name: Tests
        run: tests/run-tests.sh

  site-1600:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: '1600'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Renderer dependencies
        run: npm ci --no-audit --no-fund
        working-directory: .help

      - name: The folder holds the pinned release
        run: |
          node ../.help/pins.js 1600
          git diff --exit-code -- calc help-asset
          test -z "$(git status --porcelain -- calc help-asset)"

      - name: Build is current
        run: |
          node .site/build.js
          git diff --exit-code -- .
          test -z "$(git status --porcelain -- .)"

      - name: Check
        run: node .site/check.js

      # Includes the start test of each model and the storage test, which
      # opens /59/play/ beside /1600/play/.
      - name: Tests
        run: tests/run-tests.sh
